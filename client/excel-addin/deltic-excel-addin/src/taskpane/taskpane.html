<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Fluent UI -->
    <link rel="stylesheet"
          href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">

<header class="ms-welcome__header ms-bgColor-neutralLighter">
    <!--<img width="90" height="60" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" /> -->
    <img width="90" height="60" src="../../assets/napier-300.png" alt="Contoso" title="Contoso" />
    <h1 class="ms-font-su">Welcome</h1>
</header>

<section id="sideload-msg" class="ms-welcome__main">
    <h2 class="ms-font-xl">
        Please <a target="_blank"
        href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">
        sideload</a> your add-in to see app body.
    </h2>
</section>

<main id="app-body" style="display:none;">

    <!-- Busy overlay -->
    <div id="busy-overlay" style="
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(255,255,255,0.7);
        z-index:9999;
        font-size:20px;
        font-weight:bold;
        color:#333;
        text-align:center;
        padding-top:40%;
    ">
        Processing…
    </div>

    <!-- Week 10 TAB BAR to show difference between extraction loading step and Extrapolation step -->
    <div id="tabs" style="margin-bottom:12px;">
        <button class="tab-button ms-Button" data-tab="week9-panel">Load File</button>
        <button class="tab-button ms-Button" data-tab="week10-panel">Extrapolate</button>
    </div>

    <!-- WEEK 9 PANEL for loading and extracting data -->
    <div id="week9-panel" class="tab-panel">

        <h3>Select a file to be uploaded and extracted</h3>
        <button id="process-file-btn" class="ms-Button">Process File</button>
        <input type="file" id="hidden-file-input" style="display:none" />

        <br/>

        <h3>OR Select a previous file to load</h3>
        <select id="file-select" class="ms-Dropdown">
            <option value="">Loading...</option>
        </select>

        <br/><br/>

        <button id="load-file" class="ms-Button ms-Button--primary">
            <span class="ms-Button-label">Load File</span>
        </button>

        <button id="send-corrections-btn" class="ms-Button">
            Send Corrections
        </button>

        <br/>

        <h3>Select a table</h3>
        <select id="table-select" class="ms-Dropdown">
            <option value="">Loading...</option>
        </select>

        <br/><br/>
    </div>

    <!--  WEEK 10 AI panel for extrapolation  -->
    <div id="week10-panel" class="tab-panel" style="display:none;">

        <h3>Extrapolation Assistant</h3>

        <div id="messages"
             style="height:200px; overflow-y:auto; border:1px solid #ccc; margin-bottom:8px;">
        </div>

        <textarea id="userInput"
                  style="width:100%; height:60px;"
                  placeholder="Ask Deltic AI to estimate missing prices, analyse fields, or extrapolate…">
        </textarea>

        <button id="sendBtn" class="ms-Button ms-Button--primary">
            Send
        </button>

    </div>



</main>

</body>
</html>
