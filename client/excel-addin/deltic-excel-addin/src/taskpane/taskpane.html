<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" />
        <h1 class="ms-font-su">Welcome</h1>
    </header>
    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">Please <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a> your add-in to see app body.</h2>
    </section>
    <main id="app-body" style="display:none;">
        
        <div id="busy-overlay" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(255,255,255,0.7);
            z-index:9999;
            font-size:20px;
            font-weight:bold;
            color:#333;
            text-align:center;
            padding-top:40%;
        ">
            Processing…
        </div>
        <h3>Select a file to be uploaded and extracted</h3>
        <button id="process-file-btn" class="ms-Button">
        Process File
        </button>
        <input type="file" id="hidden-file-input" style="display:none" />
        <br/>
        <h3>OR Select a previous file to load</h3>
        <select id="file-select" class="ms-Dropdown">
            <option value="">Loading...</option>
        </select>
        <br/><br/>
        <button id="load-file" class="ms-Button ms-Button--primary">
            <span class="ms-Button-label">Load File</span>
        </button>
        <button id="send-corrections-btn">Send Corrections</button>
        <br/>
        <h3>Select a table</h3>
        <select id="table-select" class="ms-Dropdown">
        <option value="">Loading...</option>
        </select>

        <br/><br/>


    </main>
</body>

</html>
